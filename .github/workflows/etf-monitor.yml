name: ETF Monitor

on:
  schedule:
    - cron: '*/10 9-16 * * MON-FRI'
    - cron: '40 9 * * MON-FRI'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: etfmonitor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run python monitor.py
        env:
          MAILS_DEV_API_KEY: ${{ secrets.MAILS_DEV_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ETF_CODES: ${{ secrets.ETF_CODES }}
          PRICE_THRESHOLD: ${{ secrets.PRICE_THRESHOLD }}
        run: python monitor.py
      - name: Commit premium history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premium_history.json
          git diff --cached --quiet || git commit -m "update premium_history.json"
          git push origin HEAD:${{ github.ref }}
