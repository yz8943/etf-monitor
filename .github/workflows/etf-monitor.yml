# GitHub Actions 工作流：ETF 监控

name: ETF Monitor

on:
  schedule:
    # 触发条件 1：工作日（周一至周五）9:00-16:00 每 10 分钟运行一次
    - cron: '*/10 9-16 * * MON-FRI'
    # 触发条件 2：工作日早上 9:40 运行一次数据汇总任务
    - cron: '40 9 * * MON-FRI'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检查代码
        uses: actions/checkout@v2

      - name: 设置 Python 3.9+
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行监控脚本
        run: python monitor.py
        env:
          MAILS_DEV_API_KEY: ${{ secrets.MAILS_DEV_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ETF_CODES: ${{ secrets.ETF_CODES }}
          PRICE_THRESHOLD: ${{ secrets.PRICE_THRESHOLD }}
