name: ETF Monitor

on:
  schedule:
    # 北京时间 9:30 / 9:40 / 9:50
    - cron: '30,40,50 1 * * 1-5'

    # 北京时间 10:00 - 14:59 每10分钟
    - cron: '*/10 2-6 * * 1-5'

    # 北京时间 15:00
    - cron: '0 7 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: etfmonitor

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run python monitor.py
        env:
          MAILS_DEV_API_KEY: ${{ secrets.MAILS_DEV_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PRICE_THRESHOLD: ${{ secrets.PRICE_THRESHOLD }}
        run: python monitor.py

      - name: Commit premium history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premium_history.json
          git diff --cached --quiet || git commit -m "update premium_history.json"
          git pull --rebase
          git push
